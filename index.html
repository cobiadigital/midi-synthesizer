<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Poly Synth</title>
  </head>
  <body>
    <header>
      <h1>Poly Synth <small>Subtractive synthesizer in the browser</small></h1>
      <div class="transport">
        <span id="beat" class="beat-led" role="img" aria-label="Arpeggiator step indicator"></span>
        <button id="start" type="button">Start audio</button>
      </div>
    </header>
    <p id="status" class="selectable">Click Start audio, then play a MIDI keyboard, the on-screen keys, or A through K.</p>
    <main id="panel"></main>
    <div id="keyboard"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
